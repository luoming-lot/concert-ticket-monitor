services:
  - type: web
    name: concert-ticket-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && playwright install chromium --with-deps
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./data/concert_monitor.db
      - key: SECRET_KEY
        generateValue: true
      - key: HEADLESS
        value: "true"
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
