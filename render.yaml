services:
  - type: web
    name: concert-ticket-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && playwright install chromium --with-deps
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - fromDatabase:
          name: concert-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: HEADLESS
        value: "true"

databases:
  - name: concert-db
    databaseName: concert
    user: concert
    plan: free
