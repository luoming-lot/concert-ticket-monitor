services:
  - type: web
    name: concert-ticket-backend
    runtime: python
    plan: free
    buildCommand: |
      PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/.cache/playwright pip install -r backend/requirements.txt
      PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/.cache/playwright playwright install chromium
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: concert-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: HEADLESS
        value: "true"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.cache/playwright

databases:
  - name: concert-db
    databaseName: concert
    user: concert
    plan: free
